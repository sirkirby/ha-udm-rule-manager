version: 3
config_version: 9
embedding:
  provider: ollama
  model: bge-m3
capture:
  transcript_paths: []
  plan_dirs: []
  ignore_plan_dirs_in_git: false
  artifact_extensions:
    - .md
  buffer_max_events: 500
release_provenance:
  enabled: true
  production_refs:
    - refs/tags/v*
  integration_refs:
    - origin/main
  reconcile_interval_minutes: 15
  production_debug_include_unknown: true
  github:
    repo: sirkirby/unifi-network-rules
    token_env: GITHUB_TOKEN
    max_lookups_per_run: 20
  package_map: []
agent:
  summary_batch_interval: 5
  scheduled_tasks_enabled: true
  event_tasks_enabled: true
  cold_project_threshold_days: 14
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: false
  default_mode: summary
  domains:
    settings:
      enabled: true
      mode: banner
cortex:
  enabled: true
  instructions:
    inject_on_session_start: true
  digest:
    tier: 5000
    inject_on_session_start: false
  spores:
    inject_on_prompt_submit: true
    max_per_prompt: 3
  canopy:
    refresh:
      background_enabled: true
      background_period_minutes: 60
    exclude:
      default_patterns:
        - .git
        - .DS_Store
        - node_modules
        - __pycache__
        - .venv
        - venv
        - env
        - ENV
        - .pytest_cache
        - .ruff_cache
        - .mypy_cache
        - .tox
        - dist
        - build
        - target
        - .gradle
        - .cache
        - .next
        - .nuxt
        - .turbo
        - .svelte-kit
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
      patterns: []
    inject_on_pre_tool_use: true
    min_file_bytes: 800
appearance:
  theme: sage
  mode: dark
  font: default
  density: normal
symbionts:
  claude-code:
    enabled: true
  codex:
    enabled: true
  cursor:
    enabled: true
  opencode:
    enabled: true
